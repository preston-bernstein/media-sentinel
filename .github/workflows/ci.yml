name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  ci:
    uses: preston-bernstein/ci-workflows/.github/workflows/node.yml@980585f4e9c3c1ef982cb934e153f925121fe0c0 # v1
    with:
      node-versions: '["20"]'
      test: npm run test:coverage
      build: npm run build

  workflows:
    uses: preston-bernstein/ci-workflows/.github/workflows/actions-lint.yml@980585f4e9c3c1ef982cb934e153f925121fe0c0 # v1

  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The writing and postgres gates diff against main, so they need history.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install gate tools (hash-locked)
        run: |
          pip install --require-hashes -r ci-tools/requirements.txt
          npm ci --prefix ci-tools
          echo "$PWD/ci-tools/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Install actionlint and vale (checksum-verified)
        env:
          ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
          VALE_SHA256: c80d62f6bce87b81843ac5b512a26e63213927b957adba0a64fc594570da2000
        run: |
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tgz" https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/actionlint.tgz" -C "$bin" actionlint
          curl -fsSL -o "$RUNNER_TEMP/vale.tgz" https://github.com/vale-cli/vale/releases/download/v3.27.0/vale_3.27.0_Linux_64-bit.tar.gz
          echo "$VALE_SHA256  $RUNNER_TEMP/vale.tgz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/vale.tgz" -C "$bin" vale
          echo "$bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: npm ci
      - name: Run every pack gate
        run: bash scripts/gates.sh
